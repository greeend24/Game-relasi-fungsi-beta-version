<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detektif Data - Menyiapkan Permainan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .splash-card {
      width: 480px;
      padding: 36px 32px 32px 32px;
      background: radial-gradient(120% 120% at 50% 10%, #1e293b 0%, #0b0f19 80%);
      border-radius: 24px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 
                  0 0 35px rgba(245, 158, 11, 0.15),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(245, 158, 11, 0) 70%);
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }

    .icon-ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px dashed rgba(245, 158, 11, 0.45);
      animation: rotateRing 12s linear infinite;
    }

    .icon-emoji {
      font-size: 42px;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      animation: gentleFloat 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fef08a 0%, #fbbf24 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
      border-radius: 999px;
      animation: shimmerProgress 1.6s ease-in-out infinite;
      transform-origin: left;
    }

    @keyframes shimmerProgress {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      min-height: 20px;
      transition: opacity 0.25s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="icon-wrapper">
      <div class="icon-glow"></div>
      <div class="icon-ring"></div>
      <div class="icon-emoji">🦉</div>
    </div>

    <h1>DETEKTIF DATA</h1>
    <div class="badge-pill">Game Relasi &amp; Fungsi</div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="status-text" id="status">Menginisialisasi sistem investigasi...</div>
  </div>

  <script>
    const messages = [
      '🔍 Menginisialisasi sistem investigasi...',
      '📂 Menyiapkan database berkas kasus...',
      '⚙️ Membuka koneksi modul permainan...',
      '✨ Mempersiapkan ruang detektif...',
      '🚀 Sebentar lagi...'
    ];

    let index = 0;
    const statusEl = document.getElementById('status');

    setInterval(() => {
      statusEl.style.opacity = '0';
      setTimeout(() => {
        index = (index + 1) % messages.length;
        statusEl.textContent = messages[index];
        statusEl.style.opacity = '1';
      }, 250);
    }, 1200);
  </script>
</body>
</html>
