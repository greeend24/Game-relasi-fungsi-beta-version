<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Detektif Data - Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: float 2s ease-in-out infinite;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }
    
    .loader {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbf24;
      animation: bounce 1.2s ease-in-out infinite;
    }
    
    .dot:nth-child(2) { animation-delay: 0.2s; background: #f59e0b; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #d97706; }
    
    .status {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 1px;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-12px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo">🦉</div>
  <h1>DETEKTIF DATA</h1>
  <p class="subtitle">Game Relasi & Fungsi</p>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <p class="status" id="status">Mempersiapkan penyelidikan...</p>
  
  <script>
    const messages = [
      'Mempersiapkan penyelidikan...',
      'Memuat database...',
      'Menghidupkan Detektif Relo...',
      'Menyiapkan kasus...',
      'Sebentar lagi...',
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      el.textContent = messages[i];
    }, 1500);
  </script>
</body>
</html>
